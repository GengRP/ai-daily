name: Deploy Quartz site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx quartz build
      - name: Write /<lang>/latest/ redirects to the newest edition
        run: |
          for lang in cn jp en; do
            latest=$(ls public/$lang | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$' | sort | tail -1)
            [ -z "$latest" ] && continue
            day=${latest%.html}
            mkdir -p public/$lang/latest
            printf '<!doctype html><meta charset="utf-8"><title>AI Daily</title><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=/ai-daily/%s/%s"><link rel="canonical" href="/ai-daily/%s/%s"><script>location.replace("/ai-daily/%s/%s")</script><a href="/ai-daily/%s/%s">%s</a>\n' $lang $day $lang $day $lang $day $lang $day $day > public/$lang/latest/index.html
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
